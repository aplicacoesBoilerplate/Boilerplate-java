name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Flyway migration immutability
        if: github.event_name == 'pull_request'
        run: sh scripts/verify-flyway-migrations.sh "origin/${{ github.base_ref }}"

      - name: Verify
        run: ./mvnw -B verify
