<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<body
  style="
    margin:0;
    padding:0;
    background:#f5f7fb;
    font-family:Arial,Helvetica,sans-serif;
    color:#172033;
  ">
  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="
      padding:32px 0;
      background:#f5f7fb;
    ">
    <tr>
      <td align="center">
        <table
          width="650"
          cellpadding="0"
          cellspacing="0"
          style="
            background:#ffffff;
            border:1px solid #e6e9f2;
            border-radius:8px;
            overflow:hidden;"
        >
          <tr>
            <td
              style="
                padding:28px 32px;
                background:#123c69;
                color:#ffffff;"
            >
              <div
                style="
                  font-size:22px;
                  font-weight:bold;
                "
              >Boilerplate
              </div>
              <div
                style="
                  font-size:14px;
                  margin-top:4px;
                "
              >Código de recuperação de senha
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:30px;">
              <p
                style="
                  font-size:16px;
                  margin-top:0;
                "
                th:text="'Olá, ' + ${nome} + '.'"
              >Olá.
              </p>
              <p
                style="
                  font-size:15px;
                  line-height:1.5;
                  color:#3f4a5f;
                "
              >Use o código abaixo para continuar a recuperação da sua senha.
              </p>
              <div
                style="
                  margin:28px 0;
                  padding:22px;
                  text-align:center;
                  background:#f0f4fa;
                  border:1px solid #d9e2ef;
                  border-radius:8px;
                "
              >
                <div
                  style="
                    font-size:12px;
                    text-transform:uppercase;
                    color:#52627a;
                    margin-bottom:8px;
                  "
                >Código de verificação
                </div>
                <div
                  th:text="${codigo}"
                  style="
                    font-size:34px;
                    font-weight:bold;
                    letter-spacing:8px;
                    color:#123c69;
                    font-family:Consolas,monospace;
                  "
                >000000
                </div>
              </div>
              <p
                style="
                  font-size:13px;
                  color:#667085;
                ">
                Esse código expira em 10 minutos. Se você não solicitou essa recuperação, ignore este e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
