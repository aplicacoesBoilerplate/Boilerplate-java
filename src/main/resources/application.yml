spring:
  application:
    name: Boilerplate-java

  config:
    import: optional:file:src/main/resources/.env[.properties]

  # Força o uso do stack Servlet/Spring MVC, evitando autodetecção de aplicações reativas.
  main:
    web-application-type: servlet

  # Contrato público unificado de controllers REST, Actuator e documentação.
  mvc:
    servlet:
      path: /api/v1

  # Conexão principal com o MySQL. Defaults locais são apenas para desenvolvimento.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    name: ${DB_NAME:boilerplate_java}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:boilerplate_java}?createDatabaseIfNotExist=true&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME:${DB_APP_USERNAME:}}
    password: ${DB_PASSWORD:${DB_APP_PASSWORD:}}

    # Pool de conexões JDBC gerenciado pelo HikariCP.
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      connection-init-sql: "SET NAMES utf8mb4"

  # SMTP usado por fluxos de e-mail, como recuperação de senha/OTP.
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:no-reply@boilerplate.local}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${EMAIL_CONNECTION_TIMEOUT_MILLIS:5000}
          timeout: ${EMAIL_READ_TIMEOUT_MILLIS:5000}
          writetimeout: ${EMAIL_WRITE_TIMEOUT_MILLIS:5000}

  # JPA/Hibernate: Flyway é responsável pelo schema; Hibernate apenas valida compatibilidade.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Comportamento global de serialização/deserialização JSON.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      default-view-inclusion: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      repositories:
        enabled: false

# Redis e opcional: a API continua usando a fonte de verdade relacional quando indisponivel.
redis:
  enabled: ${REDIS_ENABLED:true}

# Porta HTTP da API e suporte correto a headers de proxy/reverse proxy.
server:
  port: ${API_PORT:8080}
  # Ative headers encaminhados apenas em um perfil de proxy que remova valores
  # fornecidos pelo cliente e aceite somente proxies explicitamente confiaveis.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    remoteip:
      # Vazio por padrao: nenhum proxy e confiavel fora de um perfil que o declare.
      internal-proxies: ${TRUSTED_PROXY_IP_REGEX:}
# Actuator: liveness público mínimo; diagnósticos de SMTP, health completo e métricas exigem ADMIN.
management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:true}
  endpoints:
    web:
      path-mapping:
        health: health-check
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: "GET, POST, OPTIONS"
        allowed-headers: "*"
        allow-credentials: true
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      group:
        public:
          include: ping
        smtp:
          include: mail

# Configuração base do Swagger.
springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:false}
    path: /doc/api
  swagger-ui:
    enabled: ${DOCS_ENABLED:false}
    path: /doc
  show-actuator: true

# Credenciais Basic Auth usadas para proteger a documentação Swagger em /doc.
documentacao:
  enabled: ${DOCS_ENABLED:false}
  usuario: ${DOC_USERNAME:}
  senha: ${DOC_PASSWORD:}
  senhaHash: ${DOC_PASSWORD_HASH:}

# Configurações do token JWE e autenticação Google.
tokens:
  encryptionKey: ${TOKEN_ENCRYPTION_KEY:}
  issuer: ${TOKEN_ISSUER:boilerplate-java-api}
  accessTokenMinutes: ${TOKEN_ACCESS_TOKEN_MINUTES:240}
  googleClientId: ${GOOGLE_CLIENT_ID:}

otp:
  pepper: ${OTP_PEPPER:}
  expirationMinutes: ${OTP_EXPIRATION_MINUTES:10}
  maxAttempts: ${OTP_MAX_ATTEMPTS:5}

security:
  rate-limit:
    windowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    globalRequestsPerWindow: ${RATE_LIMIT_GLOBAL_REQUESTS:1000}
    authenticatedRequestsPerWindow: ${RATE_LIMIT_AUTHENTICATED_REQUESTS:100}
    publicRequestsPerWindow: ${RATE_LIMIT_PUBLIC_REQUESTS:30}
    loginAttemptsPerWindow: ${RATE_LIMIT_LOGIN_ATTEMPTS:5}
    maxTrackedKeys: ${RATE_LIMIT_MAX_TRACKED_KEYS:10000}

# Configurações próprias da API: URL do frontend, CORS global e exposição de trace em erros.
app:
  frontendUrl: ${FRONTEND_URL:http://localhost:5173}
  corsAllowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  exposeErrorTrace: ${EXPOSE_ERROR_TRACE:false}
  maxPersistedErrors: ${MAX_PERSISTED_ERRORS:1000}

bootstrap:
  admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}
