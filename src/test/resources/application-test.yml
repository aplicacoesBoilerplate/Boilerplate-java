spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:boilerplate_java;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-spring-session-h2.sql
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 2525
    username: test@boilerplate.local
    password:

server:
  port: 0
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BOILERPLATE_SESSION
        http-only: true
        secure: false
        same-site: Lax
        path: /

documentacao:
  usuario: DeveloperArea
  senha: boilerplate
  senhaHash:

tokens:
  secret: test-secret-with-enough-size-for-hmac
  issuer: boilerplate-java-test
  accessTokenMinutes: 30
  googleClientId:

software-center:
  base-url: http://localhost:8081
  bff-client-id: test-bff-client
  bff-client-secret: test-bff-secret
  tenant-default: empresa
  timeout: 1s

app:
  frontendUrl: http://localhost:5173
  corsAllowedOrigins: http://localhost:5173
  exposeErrorTrace: true
