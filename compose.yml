services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${DB_NAME:-boilerplate_java}
      MYSQL_USER: ${DB_APP_USERNAME:?Defina DB_APP_USERNAME no arquivo .env}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/main/resources/docker/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    environment:
      API_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Somente proxies da rede interna podem fornecer X-Forwarded-*; o Nginx sobrescreve a entrada do cliente.
      TRUSTED_PROXY_IP_REGEX: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}'
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-boilerplate_java}
      DB_USERNAME: ${DB_APP_USERNAME:?Defina DB_APP_USERNAME no arquivo .env}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no arquivo .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-boilerplate-java-api}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DOC_USERNAME: ${DOC_USERNAME:-}
      DOC_PASSWORD: ${DOC_PASSWORD:-}
      DOC_PASSWORD_HASH: ${DOC_PASSWORD_HASH:-}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      OTP_PEPPER: ${OTP_PEPPER:?Defina OTP_PEPPER no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-BOILERPLATE}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v1/actuator/health-check/public > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ../../frontends/Boilerplate-vue
      dockerfile: config/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    environment:
      VITE_API_URL: /
      VITE_DOMAIN_EMAIL: ${VITE_DOMAIN_EMAIL:-}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    profiles: ["tools"]
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
